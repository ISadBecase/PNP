  max_line_spacing: 1.30
  min_height: 3.2
  max_height: 7.0
  estimated_chars_per_line: 150
  vertical_padding: 1.15

panels:
  min_count: 5
  max_count: 8
  gap: 0.25
  padding: 0.22
  title_font_size: 42
  title_line_height: 45
  title_top_padding: 0.30
  title_bottom_padding: 0.30
  min_gap: 0.20
  max_gap: 0.55

text:
  font_size: 38
  min_font_size: 35
  max_font_size: 41
