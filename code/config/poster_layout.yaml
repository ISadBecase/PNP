poster:
  width: 36.0
  dynamic_height: true
  min_height: 54.0
  reference_body_height: 39.0
  header_height: 6.0
  footer_height: 0.6
  section_gap: 0.4
  body_footer_gap: 0.6
  margin: 0.6
  column_gap: 0.4

header:
  title_font_size: 64
  title_line_height: 70
  author_font_size: 34
  author_line_height: 38
  affiliation_font_size: 26
  affiliation_line_height: 30

abstract:
  title_font_size: 42
  title_line_height: 45
  reference_font_size: 38
  min_font_size: 35
  max_font_size: 41
