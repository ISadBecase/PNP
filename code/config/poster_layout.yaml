  table:
    min_height_ratio: 0.09
    max_height_ratio: 0.24
    min_width_ratio: 0.72
    pair_min_width_ratio: 0.36
  equation:
    min_height_ratio: 0.05
    max_height_ratio: 0.16
    source_dpi: 600
    source_font_size: 10
    target_font_size: 28
    max_width_ratio: 0.94

layout:
  target_utilization: 0.96
  overflow_tolerance: 0.01
  max_column_height_difference: 0.08
  max_iterations: 3

importance_scale:
  1: 0.45
  2: 0.60
  3: 0.75
  4: 0.90
  5: 1.00
