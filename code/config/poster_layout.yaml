  min_line_spacing: 1.60
  max_line_spacing: 1.80
  estimated_chars_per_line: 42

assets:
  figure:
    min_height_ratio: 0.08
    max_height_ratio: 0.28
    wide_ratio_threshold: 1.5
    wide_width_ratio: 0.96
    pair_target_ratio: 2.0
    pair_ratio_tolerance: 0.35
    pair_width_ratio: 0.96
