"Method/Algorithm":
  solution:
    - What is the complete algorithm flow, key modules, and data flow of the paper?
    - What objective functions, optimization strategies, training processes, or inference mechanisms constitute the core of the method?
  results:
    - What experiments validate the effectiveness of the core modules and key design choices?
  figures:
    - What combinations of images most clearly explain the method architecture, data flow, and core mechanisms?
  tables:
    - What combinations of tables most powerfully demonstrate the overall performance of the method and the effectiveness of each component?
  equations:
    - What formulas should be combined to fully express the core algorithm, objective functions, or optimization processes?

"Theory/Analysis":
  solution:
    - What definitions, assumptions, theoretical claims, derivations, or analytical frameworks does the paper use?
    - What are the conditions under which the core theoretical conclusions hold, and what is their explanatory significance?
  results:
    - What theoretical, empirical, or explanatory evidence supports the core claims of the paper?
  figures:
    - What combinations of images most intuitively present key phenomena, mechanisms, or theoretical relationships?
  tables:
    - What combinations of tables provide decisive evidence for the core theoretical conclusions or empirical analyses?
  equations:
    - What definitions, theorems, or derivation formulas should be combined to express the theoretical innovations of the paper?

"Benchmark/Evaluation":
  solution:
    - How does the paper define the task, dataset, evaluation protocols, metrics, or benchmarks?
    - What are the key steps in data construction, annotation, partitioning, metric design, or baseline selection?
  results:
    - What results demonstrate the value and distinctiveness of the new tasks, datasets, metrics, or evaluation protocols?
  figures:
    - What combinations of images most intuitively display the task definition, data characteristics, sample distribution, or evaluation process?
  tables:
    - What combinations of tables most clearly summarize data statistics, benchmark results, and key comparisons?
  equations:
    - What formulas define the core metrics, task objectives, or evaluation methods that are worth showcasing in the poster?

"Survey / Review":
  motivation:
    - From what perspective does the paper elaborate on what research question?
    - What scattered, chaotic, or unresolved issues exist in the current knowledge or research pathways?
  solution:
    - What is the scope of the literature reviewed in the paper, the selection methods, classification system, or organizational framework? Please provide an overview.
    - What key dimensions does the paper classify to elaborate on existing methods? Please provide an overview.
    - What are the main characteristics and differences of various existing methods as perceived by the paper? Please provide an overview.
  results:
    - What major trends, consensus, controversies, research gaps, and future directions does the paper identify?
  contributions:
    - What unique value does the classification system, unified perspective, or research agenda proposed by the paper have?
  figures:
    - What combinations of images most clearly display the panoramic view of the field, method classification, development context, or unified framework?
  tables:
    - What combinations of tables are most suitable for comparing the capabilities, applicable scenarios, advantages, and limitations of different method categories?
  equations:
    - What formulas are representative across methods and can help explain the classification dimensions or core technical differences in the paper?