motivation:
  - What research problem does this paper attempt to address? Why is this problem important?
  - What limitations exist in current methods, and how do these limitations motivate the authors to conduct this research?
  - What research gaps or key challenges does the paper identify?

solution:
  - What methods, systems, theories, or evaluation schemes does the paper propose? Please provide an overall overview.
  - What are the main components or processing stages of the proposed solution, and how do they work together?
  - What are the most important technical innovations, design choices, or theoretical perspectives in the paper?
  - What algorithmic processes, training methods, implementation settings, or analysis steps does the paper adopt?

results:
  - What datasets, experimental setups, evaluation metrics, or analysis protocols does the paper use?
  - What are the most important quantitative and qualitative results? Please retain key values and comparative relationships.
  - How does the proposed solution perform compared to existing methods or baselines?
  - What conclusions are supported by ablation studies, sensitivity analyses, or supplementary analyses?

contributions:
  - What are the main contributions of the paper?
  - In what ways does the paper's novelty manifest compared to existing work?
  - What limitations does the paper acknowledge, and what future research directions does it propose?

figures:
  - Which figures most intuitively present the research problem, methodological mechanisms, or key findings?
  - Which figures can be combined to explain the complete methodological process or evidence of effectiveness?
  - Which figures are redundant, overly detailed, or unsuitable for intuitively conveying the paper's focus?

tables:
  - Which tables provide the strongest quantitative evidence for the core claims of the paper?
  - Which tables can be combined to express overall performance, ablation conclusions, or data characteristics?
  - Which tables are overly detailed, redundant, or unsuitable for the final poster?

equations:
  - Which equations collectively define the core methods, theoretical claims, or evaluation metrics of the paper?
  - Which equations should be combined to fully express a particular viewpoint or process? Summarize the meaning expressed after combining.
  - Which equations are too conventional, rely on lengthy derivations, or are unsuitable for the final poster?