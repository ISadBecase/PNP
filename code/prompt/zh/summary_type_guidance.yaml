"Method/Algorithm": |
  优先形成研究问题、方法总览、关键模块或核心公式、主要结果和消融证据等主题。
  方法主题应获得最多篇幅，并优先关联架构图、流程图、核心公式和验证设计选择的表格。

"Theory/Analysis": |
  优先形成问题设定、关键现象、核心主张、代表性推导或分析证据、理论含义和局限等主题。
  只保留理解核心主张所必需的公式组合，避免在海报中呈现冗长证明。

"Benchmark/Evaluation": |
  优先形成任务或数据定义、构建与评估协议、代表性样本或统计、基准比较、主要发现和局限等主题。
  优先选择数据概览图、指标定义公式、数据统计表和具有区分度的主结果表。

"Survey / Review": |
  优先形成综述范围与动机、分类体系或统一框架、主要方法类别比较、领域趋势、研究空白和未来议程等主题。
  优先选择分类图、发展脉络图和方法对比表；仅保留能够代表一类方法或解释关键分类维度的公式。
  避免按论文逐篇罗列，应将内容综合为少量具有比较意义的主题。
