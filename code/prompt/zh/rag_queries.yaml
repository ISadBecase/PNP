motivation:
  - 这篇论文旨在解决什么问题或任务？请描述其中面临的具体挑战？
  - 论文在引言或相关工作中提到了现有方法的哪些局限或缺点？
  - 哪些尚未满足的需求或研究空白推动了这项研究？该研究与已有工作有何不同？

solution:
  - 这篇论文提出了什么方法、技术路线或框架？请提供整体概述。
  - 所提方案包含哪些主要组成部分或处理阶段，它们如何协同工作？
  - 论文中有哪些关键方程、公式或数学定义？请展示符号及数学表达式。
  - 该方法的算法、执行过程或工作流程是什么？请描述其中的关键步骤。

results:
  - 论文使用了哪些数据集、实验设置、基准任务进行评估？
  - 论文使用了哪些评价指标或评价标准来衡量性能？
  - 所提出的方法与基线方法或已有方法相比表现如何？请展示具体对比。
  - 所提出的方法取得了怎样的性能？请报告实验中的准确数值。
  - 论文中包含了哪些消融实验和额外观察结果？请提供简要概述。

contributions:
  - 论文在引言或结论中列出的主要贡献是什么？
  - 与现有方法相比，这项工作的创新点或新颖之处是什么？
  - 论文承认了哪些局限？提出了哪些未来研究方向？

figures:
  - 哪些图片直观地呈现研究问题和研究动机？
  - 哪些图片可以组合起来解释论文完整的方法流程？
  - 哪些图片重复、过于细节化或不适合直观体现论文重点？

tables:
  - 哪些表格定量直观地呈现了论文的主要实验结果？
  - 哪些表格可以组合起来表达消融结论，证明模块有效性？
  - 哪些表格展示了不同方法或设置下的性能对比？
  - 哪些表格用于描述通用常见配置、或过于详细，不适合最终海报式呈现？

equations:
  - 哪些公式用于阐明背景知识或相关工作？
  - 哪些公式共同定义了论文的核心方法或流程？
  - 哪些公式过于常规、依赖冗长推导或不适合最终海报？
