motivation:
  - 这篇论文试图解决什么研究问题？为什么这个问题重要？
  - 现有方法存在哪些局限，这些局限如何促使作者开展本研究？
  - 论文识别了什么研究空白或关键挑战？

solution:
  - 论文提出了什么方法、系统、理论或评估方案？请给出整体概述。
  - 所提方案包含哪些主要组成部分或处理阶段，它们如何协同工作？
  - 论文最重要的技术创新、设计选择或理论观点是什么？
  - 论文采用了什么算法流程、训练方式、实现设置或分析步骤？

results:
  - 论文使用了哪些数据集、实验设置、评价指标或分析协议？
  - 最重要的定量和定性结果是什么？请保留关键数值和比较关系。
  - 所提方案与已有方法或基线相比表现如何？
  - 消融实验、敏感性分析或补充分析支持了哪些结论？

contributions:
  - 论文的主要贡献是什么？
  - 与已有工作相比，论文的新颖性体现在哪里？
  - 论文承认了哪些局限，并提出了哪些未来研究方向？

figures:
  - 哪些图片最直观地呈现研究问题、方法机制或关键发现？
  - 哪些图片可以组合起来解释完整的方法流程或有效性证据？
  - 哪些图片重复、过于细节化或不适合直观体现论文重点？

tables:
  - 哪些表格为论文核心主张提供了最强的定量证据？
  - 哪些表格可以组合起来表达整体性能、消融结论或数据特征？
  - 哪些表格过于详细、重复或不适合最终海报？

equations:
  - 哪些公式共同定义了论文的核心方法、理论主张或评价指标？
  - 哪些公式应组合展示才能表达完整某个观点或流程？概述组合后表达的含义。
  - 哪些公式过于常规、依赖冗长推导或不适合最终海报？
