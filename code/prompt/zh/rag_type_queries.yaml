"Method/Algorithm":
  solution:
    - 论文的完整算法流程、关键模块和数据流是什么？
    - 哪些目标函数、优化策略、训练过程或推理机制构成了方法核心？
  results:
    - 哪些实验分别验证了核心模块和关键设计选择的有效性？
  figures:
    - 哪些图片组合最清楚地解释方法架构、数据流和核心机制？
  tables:
    - 哪些表格组合最有力地证明方法整体性能及各组件的有效性？
  equations:
    - 哪些公式应组合展示，才能完整表达核心算法、目标函数或优化过程？

"Theory/Analysis":
  solution:
    - 论文使用了哪些定义、假设、理论主张、推导或分析框架？
    - 核心理论结论成立的条件及其解释意义是什么？
  results:
    - 哪些理论、实证或解释性证据支持论文的核心主张？
  figures:
    - 哪些图片组合最直观地呈现关键现象、机制或理论关系？
  tables:
    - 哪些表格组合为核心理论结论或实证分析提供决定性证据？
  equations:
    - 哪些定义、定理或推导公式应组合展示，才能表达论文的理论创新？

"Benchmark/Evaluation":
  solution:
    - 论文如何定义任务、数据集、评估协议、指标或基准？
    - 数据构建、标注、划分、指标设计或基线选择的关键步骤是什么？
  results:
    - 哪些结果证明新任务、数据集、指标或评估协议具有价值和区分度？
  figures:
    - 哪些图片组合最直观地展示任务定义、数据特征、样本分布或评估流程？
  tables:
    - 哪些表格组合最清楚地概括数据统计、基准结果和关键比较？
  equations:
    - 哪些公式定义了核心指标、任务目标或评估方法，值得在海报中展示？

"Survey / Review":
  motivation:
    - 该领域为什么需要这项综述，现有知识或研究路线存在哪些分散、混乱或未解决的问题？
  solution:
    - 论文采用了什么文献范围、筛选方法、分类体系或组织框架？
    - 论文依据哪些关键维度比较现有方法，各类方法的主要特征和差异是什么？
  results:
    - 综述识别了哪些主要趋势、共识、争议、研究空白和未来方向？
  contributions:
    - 论文提出的分类体系、统一视角或研究议程具有哪些独特价值？
  figures:
    - 哪些图片组合最清楚地展示领域全景、方法分类、发展脉络或统一框架？
  tables:
    - 哪些表格组合最适合比较不同方法类别的能力、适用场景、优点和局限？
  equations:
    - 哪些公式具有跨方法的代表性，能够帮助解释综述中的分类维度或核心技术差异？
