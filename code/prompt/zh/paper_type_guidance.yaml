method/algorithm:
  section_guidance: |
    优先呈现研究问题、现有方法的局限性、方法概述、关键组件、技术流程、
    主要结果、消融实验和贡献。应为所提出的方法分配最多的内容篇幅。
  asset_guidance: |
    方法部分优先使用架构图和工作流程图，技术组件使用核心公式，
    结果部分使用对比表或消融实验表。

theory/analysis:
  section_guidance: |
    优先呈现问题设定、假设、定义、核心主张、具有代表性的分析或证明思路、
    含义和局限性。
  asset_guidance: |
    优先使用体现定义和主张的代表性公式、解释机制的概念图；
    仅当表格支持核心理论或实证比较时才使用表格。

problem definition/evaluation:
  section_guidance: |
    应优先呈现任务定义、数据集或基准构建、评估协议、指标、基线方法、
    主要发现和局限性。
  asset_guidance: |
    应优先使用数据集概览图、基准测试图、定义指标的公式，
    以及包含决定性结果的主要对比表。

application/trustworthiness:
  section_guidance: |
    应优先呈现实践问题、应用场景、相关利益方、系统工作流程、可靠性或风险分析、
    评估、局限性和更广泛的影响。
  asset_guidance: |
    优先使用应用工作流程图、定性示例、安全性或可靠性分析以及结果表。
    仅当公式对机制或评估至关重要时才选择公式。
